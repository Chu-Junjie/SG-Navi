name: task7-junjie-render-neon-https-smoke

# This is a real remote check, not a claim that the Render and Pages SHA match.
# On main pushes, check the deployed API; browser checks run on scheduled/manual
# checks (and on this review branch) to avoid racing GitHub Pages publication.
on:
  push:
    branches: [main, feat/task7-free-hosting-hardening]
  schedule:
    - cron: '10 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sg-navi-public-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  public-https-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install actual contract validation requirements
        run: python -m pip install -r tests/contracts/requirements.txt
      - name: Verify deployed HTTPS API, CORS, two cases and Neon mode
        env:
          BASE_URL: https://sg-navi-api-junjie.onrender.com
        run: |
          set -euo pipefail
          printf 'workflow_sha=%s\nworkflow_ref=%s\nAPI=%s\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" "$BASE_URL" > task7-junjie-meta.txt
          healthy=0
          for i in $(seq 1 24); do
            if curl --silent --show-error --fail --max-time 25 \
              --header 'Origin: https://chu-junjie.github.io' \
              --dump-header task7-junjie-headers.txt \
              --output task7-junjie-health.json \
              "$BASE_URL/api/health"; then
              healthy=1
              break
            fi
            sleep 10
          done
          if [ "$healthy" -ne 1 ]; then
            echo 'FAIL: actual Render API did not return HTTP 200' >&2
            exit 1
          fi
          if ! grep -qi '^x-sg-navi-deployment-mode: postgres-backed-free-demo' task7-junjie-headers.txt; then
            echo 'FAIL: service did not disclose the expected Neon-backed demo mode' >&2
            exit 1
          fi
          python -m backend.smoke_public --base-url "$BASE_URL" > task7-junjie-smoke.json
          python -c "import json; r=json.load(open('task7-junjie-smoke.json')); assert r['passed'], json.dumps([c for c in r['checks'] if not c['passed']]); print('Actual HTTPS checks passed:', len(r['checks']))"
      - name: Upload genuine API evidence (also on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sg-navi-junjie-public-api
          path: |
            task7-junjie-meta.txt
            task7-junjie-health.json
            task7-junjie-smoke.json
            task7-junjie-headers.txt
          retention-days: 30
          if-no-files-found: warn

  real-published-browser:
    # The first branch test and weekly/manual tests exercise the ACTUAL Pages.
    # A push to main can precede a Pages publish; avoid false release evidence.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/feat/task7-free-hosting-hardening'
    needs: public-https-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Real browser acceptance against published GitHub Pages
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$BROWSER" ]; then
            echo 'FAIL: Chromium-family browser unavailable; cannot count UI acceptance'
            exit 1
          fi
          mkdir -p instance/task7-public-pages-browser
          node frontend/tests/task7_public_pages_check.mjs \
            https://chu-junjie.github.io/SG-Navi/ \
            "$BROWSER" https://sg-navi-api-junjie.onrender.com \
            > task7-junjie-browser-trace.log 2>&1 || {
              grep -E '^TASK7_PUBLIC_STEP |^SGNAVI_TASK7_PUBLIC_JSON=' task7-junjie-browser-trace.log | cut -c 1-500
              exit 1
            }
          python3 - <<'PY'
          import json
          from pathlib import Path
          lines = Path('task7-junjie-browser-trace.log').read_text().splitlines()
          reports = [x.partition('=')[2] for x in lines if x.startswith('SGNAVI_TASK7_PUBLIC_JSON=')]
          assert reports, 'No genuine browser result from test'
          report = json.loads(reports[-1])
          assert report['passed'] and len(report['cases']) == 2
          assert all(case['passed'] and len(case['steps']) == 9 for case in report['cases'])
          assert report['javascript_exceptions'] == 0
          Path('task7-junjie-browser.json').write_text(json.dumps(report, indent=2))
          print('Real published Pages cases passed:', len(report['cases']), 'screenshots:', len(report['screenshots']))
          PY
      - name: Save actual published-browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sg-navi-junjie-real-browser
          path: |
            task7-junjie-browser-trace.log
            task7-junjie-browser.json
            instance/task7-public-pages-browser/public-pages-*.jpg
          retention-days: 30
          if-no-files-found: warn
