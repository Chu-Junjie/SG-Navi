name: tests

on:
  push:
    branches: [main, "feat/**", "fix/**", "docs/**"]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            tests/contracts/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r tests/contracts/requirements.txt
      - name: Validate shared API contract examples
        run: python -m shared.validate_contracts
      - name: Run backend and contract tests
        run: python -m pytest tests/contracts tests/backend tests/rag tests/integration -v
      - name: Smoke-test production Gunicorn WSGI on loopback
        run: python tests/backend/run_task7_wsgi_smoke.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run frontend tests
        run: python -m unittest discover -s frontend/tests -v
      - name: Preserve Task 15 actual regression and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task15-local-integration-evidence
          path: |
            instance/task15-ci-regression.json
            instance/task15-browser-local/report.json
            instance/task15-browser-local/*.jpg
          if-no-files-found: warn

      - name: Preserve Task 21 actual action-first browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task21-local-action-first-evidence
          path: |
            instance/task21-browser-local/report.json
            instance/task21-browser-local/*.jpg
          if-no-files-found: warn
